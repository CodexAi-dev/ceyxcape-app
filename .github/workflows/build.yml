# Name shown on the GitHub "Actions" tab
name: Build Check

# WHEN this robot runs: on every push to main, and on every pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: check the backend compiles ──
  backend:
    runs-on: ubuntu-latest          # the robot uses a fresh Linux machine
    steps:
      - uses: actions/checkout@v4   # download your code

      - uses: actions/setup-node@v4 # install Node.js
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci                 # clean install from the lockfile

      - name: Build backend
        working-directory: backend
        run: npm run build          # = nest build

  # ── Job 2: check the frontend compiles ──
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build          # = next build
        env:
          # Dummy value just so the build succeeds — not a real secret.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
